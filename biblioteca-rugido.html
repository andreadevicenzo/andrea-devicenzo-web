const entries=[{"id": "1", "title": "¿Cuánto futuro hay en las decisiones que tomamos hoy?", "date": "2026-11-02", "body": "Hay empresas que conocen muy bien su historia. Saben cómo empezaron, recuerdan las dificultades que atravesaron y reconocen las decisiones que les permitieron llegar hasta donde están.\n\nCon el tiempo desarrollaron capacidades, consolidaron relaciones, incorporaron conocimientos y construyeron una manera propia de hacer las cosas.\n\nTodo eso forma parte de su identidad y merece ser comprendido.\n\nPero también puede ocurrir que algunas decisiones que fueron acertadas hace diez años hoy necesiten revisarse. Que una fortaleza haya perdido parte de su importancia o que una forma de organizar el trabajo, adecuada cuando la empresa era más pequeña, ya no responda a sus necesidades actuales.\n\nMirar hacia atrás nos ayuda a comprender cómo llegamos hasta acá. También nos permite reconocer qué conviene preservar, qué necesitamos transformar y qué aprendizajes pueden acompañarnos hacia adelante.\n\nPorque una organización tiene una historia, funciona en un presente determinado y necesita desarrollar la capacidad de pensar su futuro.\n\nLo que fuimos construyendo\nCuando analizamos la trayectoria de una empresa podemos identificar mucho más que sus resultados.\n\nEncontramos fortalezas que se consolidaron con los años, debilidades que fueron superadas, oportunidades que se aprovecharon y otras que quedaron en el camino. También las amenazas que obligaron a tomar decisiones y desarrollar nuevas maneras de trabajar.\n\nSin embargo, hay algo que merece especial atención: las fortalezas y debilidades de una organización cambian con el tiempo.\n\nPensemos en una empresa familiar que, durante sus primeros años, encontró una ventaja en la cercanía de sus fundadores con la operación.\n\nConocían a los clientes, a los proveedores y a cada persona del equipo. Podían resolver situaciones rápidamente y tomar decisiones sin demasiadas instancias de consulta.\n\nCon el crecimiento, esa misma concentración de decisiones pudo comenzar a generar demoras. Algunas personas quedaron esperando autorizaciones, se multiplicaron las consultas y buena parte del conocimiento permaneció en manos de unos pocos.\n\nUna forma de trabajar que había contribuido al desarrollo de la empresa empezó a mostrar limitaciones.\n\nEsto nos obliga a mirar las fortalezas y debilidades en relación con el momento que atraviesa la organización y con los desafíos que tiene por delante.\n\n¿Qué capacidades nos permitieron llegar hasta acá? ¿Cuáles siguen siendo una ventaja? ¿Qué dificultades logramos resolver y cuáles persisten? ¿Qué prácticas necesitan evolucionar?\n\nConocer la historia también implica comprender cómo fuimos cambiando.\n\nComprender el presente y mirar hacia afuera\nToda empresa se encuentra en una situación particular.\n\nTiene determinados recursos, personas, conocimientos, procesos y capacidades. También forma parte de un entorno que influye sobre sus decisiones, aunque muchas de sus variables estén fuera de su control.\n\nLas condiciones económicas, los cambios tecnológicos, las regulaciones, las transformaciones sociales y el comportamiento de clientes, proveedores y competidores pueden modificar significativamente las posibilidades de una organización.\n\nPor eso, para pensar estratégicamente necesitamos comprender tanto la realidad interna como aquello que sucede alrededor.\n\nHerramientas como el análisis FODA y el análisis del entorno permiten ordenar información, reconocer relaciones y establecer prioridades.\n\nPero identificar fortalezas, debilidades, oportunidades y amenazas es apenas una parte del trabajo.\n\nEl verdadero desafío aparece cuando nos preguntamos qué decisiones surgen de ese análisis.\nSupongamos que una empresa identifica una oportunidad para ingresar a un nuevo mercado.\n\nCuenta con productos competitivos, experiencia y buenas relaciones comerciales. Sin embargo, sus procesos productivos están cerca del límite de capacidad y la información necesaria para planificar nuevas operaciones se encuentra dispersa entre distintos sectores.\n\nLa oportunidad existe. Las fortalezas también.\n\nPero las debilidades identificadas pueden condicionar seriamente la posibilidad de aprovecharla.\n\nLa pregunta comienza a ser otra: ¿qué capacidades necesitamos desarrollar para que esa oportunidad sea viable?\n\nY, a partir de ahí, ¿qué necesitamos priorizar?\n\nEl análisis adquiere valor cuando contribuye a tomar decisiones.\n\nImaginar hacia adelante\nPensar en el futuro de una empresa requiere definir hacia dónde queremos conducirla.\n\nQué mercados queremos atender, qué valor queremos ofrecer, qué capacidades deseamos desarrollar y qué características esperamos que tenga nuestra organización dentro de algunos años.\n\nImaginar ese futuro implica declarar una dirección hacia la cual queremos avanzar y comenzar a diseñar las condiciones necesarias para hacerlo posible.\n\nPero hay una dificultad que debemos reconocer: el entorno también tiene su propio movimiento.\n\nPodemos definir un rumbo y, al mismo tiempo, encontrarnos con situaciones que no habíamos previsto.\n\n¿Qué pasaría si una nueva tecnología modificara nuestro sector? ¿Si aparecieran competidores con otra propuesta de valor? ¿Si cambiaran las regulaciones o las necesidades de nuestros clientes?\n\nTrabajar con escenarios nos permite considerar diferentes evoluciones posibles del entorno y evaluar cómo podrían afectar a nuestra empresa.\n\nNo tenemos certezas sobre cuál de esos escenarios se presentará. Pero podemos reconocer señales, analizar riesgos, identificar oportunidades y preparar alternativas.\n\nEl futuro que queremos construir debe dialogar con los futuros posibles que plantea el entorno.\n\nY en ese diálogo necesitamos revisar periódicamente nuestras decisiones.\n\n¿Nuestra organización está preparada para ese futuro?\nVolvamos a la empresa familiar del comienzo.\n\nImaginemos que sus propietarios aspiran a ampliar sus mercados y lograr que, en los próximos años, la empresa pueda funcionar con mayor autonomía respecto de ellos.\n\nEs una definición que plantea desafíos concretos.\n\nSerá necesario revisar cómo se toman las decisiones, qué responsabilidades pueden delegarse, qué conocimientos deberían compartirse y qué capacidades comerciales y operativas necesita desarrollar la empresa.\n\nProbablemente también haya que revisar procesos, sistemas de información, mecanismos de coordinación y niveles de responsabilidad.\n\nAlgunas mejoras podrán iniciarse rápidamente. Otras requerirán recursos, inversiones y tiempo.\n\nLo importante será establecer prioridades, definir quiénes participarán de cada iniciativa y cómo se evaluarán sus avances.\n\nUna empresa puede tener muy claro hacia dónde quiere ir y, sin embargo, seguir organizada para funcionar como lo hizo durante los últimos veinte años.\nAhí aparece una distancia que merece ser analizada: la que existe entre nuestras aspiraciones estratégicas y las capacidades reales de la organización para llevarlas adelante.\n\nLa estrategia necesita traducirse en decisiones sobre personas, estructura, procesos, recursos y formas de trabajar.\n\nY esas decisiones deben guardar relación entre sí.\n\nDe poco serviría incorporar nuevos mercados si la empresa no cuenta con la capacidad necesaria para atenderlos. O delegar responsabilidades sin asegurar que las personas dispongan de información, criterios y autoridad para decidir.\n\nPensar a largo plazo también requiere trabajar sobre esas condiciones desde el presente.\n\nDel análisis a las decisiones\nUna manera de comenzar es reunir a quienes participan en las decisiones de la empresa y trabajar sobre tres cuestiones.\n\n¿Qué necesitamos preservar?\n\nReconocer las capacidades, conocimientos, relaciones y formas de trabajar que fueron importantes para nuestro desarrollo y que pueden seguir aportando valor.\n\n¿Qué necesitamos transformar?\n\nIdentificar las debilidades actuales, las prácticas que perdieron efectividad y las capacidades que será necesario desarrollar para responder a los desafíos futuros.\n\n¿Qué necesitamos empezar a decidir?\n\nEstablecer prioridades, definir responsabilidades, asignar recursos y acordar cómo vamos a evaluar los avances.\n\nEstas preguntas pueden ayudar a conectar nuestra historia con el futuro que queremos construir.\n\nPero el trabajo necesita continuar. Las decisiones deben transformarse en acciones, contar con responsables y revisarse periódicamente.\n\nPorque las condiciones pueden cambiar, algunas hipótesis pueden dejar de ser válidas y los resultados obtenidos pueden mostrar que necesitamos ajustar el rumbo.\n\nLa planificación también requiere capacidad de aprendizaje.\n\nEl largo plazo empieza hoy\nToda organización lleva consigo su historia.\n\nLas decisiones que tomó, las personas que participaron de su desarrollo, los conocimientos que acumuló y las dificultades que logró superar explican buena parte de lo que es hoy.\n\nComprender esa trayectoria nos ayuda a reconocer las capacidades disponibles y los cambios que necesitamos considerar.\n\nA partir de ahí, podemos imaginar distintos escenarios, definir un rumbo y comenzar a construir las condiciones para avanzar.\n\nQuizás dentro de cinco años la realidad sea diferente de la que hoy imaginamos. Habremos encontrado nuevas oportunidades, enfrentado dificultades y revisado algunas decisiones.\n\nPero hay algo sobre lo que podemos actuar desde ahora: las capacidades que desarrollamos, las conversaciones que promovemos y las decisiones que empezamos a tomar.\n\nY entonces vale la pena preguntarnos:\n\n¿Estamos tomando decisiones para sostener la empresa que tenemos o también para construir la que queremos tener?"}, {"id": "2", "title": "El organigrama no siempre cuenta toda la historia", "date": "2026-10-01", "body": "Hay algo que siempre me llama la atención cuando salgo a caminar por parques y espacios verdes.\n\n\nEstán los senderos diseñados, prolijos, pensados para llevarnos de un lugar a otro. Y después están esos otros caminos, los que se fueron marcando sobre el pasto porque, todos los días, alguien necesitó llegar de un punto a otro de una manera diferente.\n\n\nNadie los diseñó. No aparecen en ningún plano. Pero están ahí.\n\n\n[Imagen original enlazada en la publicación]\n\n\nEn las organizaciones pasa algo parecido.\n\n\nPodemos tener un organigrama que muestra áreas, puestos, dependencias y líneas de autoridad. Podemos tener descriptivos de puestos que explican qué debería hacer cada persona.\n\n\nPero cuando empezamos a mirar cómo se trabaja realmente, muchas veces aparece otro dibujo.\n\n\nPorque saber de quién depende una persona no alcanza para entender cómo funciona su trabajo.\n\n\nHay que mirar a quién consulta cuando tiene una duda. Quién tiene la información que necesita. Quién puede autorizar. A quién recurre cuando algo se traba. Quién termina tomando una decisión aunque formalmente esa decisión no esté dentro de su puesto.\n\n\nAhí empieza a aparecer la estructura real.\n\n\nY esa estructura no necesariamente está mal.\n\n\nComo el sendero que se forma sobre el pasto, muchas veces es una respuesta que la propia organización fue construyendo para poder funcionar. El negocio creció, aparecieron nuevas necesidades, algunas personas asumieron responsabilidades, otras se convirtieron en referentes y determinados circuitos se fueron armando sin que nadie los hubiera diseñado formalmente.\n\n\nEl problema aparece cuando la distancia entre la estructura dibujada y la estructura real empieza a ser demasiado grande.\n\n\nPorque entonces podemos encontrar funciones que no están claramente ubicadas, responsabilidades compartidas que nadie termina de asumir, decisiones que suben más de lo necesario, personas que concentran información o conocimiento y puestos que, en la práctica, hacen bastante más —o algo bastante distinto— de lo que la organización supone.\n\n\nPor eso, para entender una estructura, no alcanza con mirar las cajas del organigrama.\n\n\nHay que seguir el trabajo.\n\n\n¿Quién hace qué? ¿Quién consulta a quién? ¿Quién reemplaza a quién? ¿Quién aprueba? ¿Quién tiene determinada información? ¿Dónde empieza y termina una responsabilidad? ¿Qué pasa cuando una persona no está?\n\n\nCuando empezamos a hacer esas preguntas, muchas veces aparece una organización diferente de la que estaba dibujada.\n\n\nY hay otra consecuencia que no siempre aparece en el organigrama: lo que esta falta de claridad produce en las personas.\n\n\nTrabajar sin tener demasiado claro qué se espera de uno, hasta dónde llega una responsabilidad, quién puede decidir o por qué una tarea necesita pasar una y otra vez por distintas personas genera desgaste.\n\n\nNo significa que toda falta de claridad produzca automáticamente desmotivación ni que explique por sí sola un mal resultado. Las organizaciones son bastante más complejas que eso.\n\n\nPero hace tiempo que la investigación viene estudiando qué sucede cuando las personas trabajan sin suficiente claridad sobre su rol.\n\n\nTubre y Collins encontraron una relación negativa entre la ambigüedad de rol y el desempeño. Más recientemente, Sawhney y sus colegas, al revisar seis décadas de investigación sobre los llamados estresores de rol, encontraron que la ambigüedad de rol puede tener efectos relevantes sobre distintos resultados individuales y organizacionales.\n\n\nY no hace falta ir demasiado lejos para entender por qué.\n\n\nCuando no está claro quién decide, hasta dónde llega una responsabilidad, a quién hay que consultar o por dónde tiene que pasar algo para que avance, el impulso y la energía se van difuminando entre distintos caminos.\n\n\nUna consulta lleva a otra. Una decisión pasa por varias personas. Una responsabilidad cambia de manos. Y parte del esfuerzo cotidiano queda puesto en encontrar el camino para que las cosas sucedan.\n\n\nPor eso ordenar una estructura tiene bastante menos que ver con mover cajas en un organigrama de lo que parece.\n\n\nTiene que ver con entender cómo circula realmente el trabajo, dónde están las decisiones, qué responsabilidades fueron apareciendo con el tiempo y qué caminos construyeron las personas para que las cosas sucedan.\n\n\nDespués vendrá otra discusión: cuáles de esos caminos conviene formalizar, cuáles necesitan ser revisados y cuáles ya no deberían ser necesarios.\n\n\nPero difícilmente podamos diseñar una estructura mejor si antes no entendemos la que ya existe.\n\n\nPorque el organigrama muestra una parte de la organización.\n\n\nEl trabajo cotidiano dibuja el resto.\n\n\n¿Cuánto se parece la estructura dibujada de tu organización a la forma en que realmente se trabaja?\n\n\nAndrea De Vicenzo Consultora en Diseño Organizacional\n\n\nEl Rugido Interior es un espacio para compartir ideas y reflexiones sobre cómo diseñar organizaciones más claras, humanas y sostenibles.\n\n\n\n\n."}, {"id": "3", "title": "Cuando la estructura ya no acompaña el crecimiento", "date": "2026-09-01", "body": "Hay organizaciones que crecen mucho más rápido que la estructura que las sostiene. Y mientras el crecimiento suele verse como una buena noticia —más clientes, más productos, más personas, más facturación, nuevos negocios—, no siempre se advierte que crecer también modifica la forma en que una organización necesita trabajar.\nCuando una empresa pasa de cinco personas a trescientas, ya no alcanza con que todos sepan quién hace cada cosa. Tampoco es suficiente con que exista una persona que “siempre sabe” cómo resolver determinado tema o que, ante una duda, todos sepan a quién recurrir. La cantidad de relaciones aumenta, las decisiones se multiplican, aparecen nuevos niveles de responsabilidad y aquello que antes podía resolverse con una conversación empieza a necesitar mayor claridad.\nHace algunos años, mientras hacía mi trabajo de maestría, me encontré con una analogía de Mintzberg que todavía hoy sigo encontrando útil para mirar las organizaciones. El autor propone estudiar la estrategia como un elefante y, siguiendo esa imagen, observar la organización, sus componentes, las relaciones que en ella se generan, las instituciones que la atraviesan, el contexto y el cambio que influyen en su vida, como el hábitat en el que ese elefante nace, crece, aprende, se mueve y vive.\nLa imagen me quedó dando vueltas porque permite entender que una organización no puede ser observada por partes aisladas. Su estructura, las personas que la integran, la forma en que se toman decisiones, los procesos, la cultura y la estrategia se relacionan entre sí y se modifican con el tiempo.\nEl elefante crece. Y si crece, también necesita aprender a moverse de otra manera.\nUna estructura que funcionaba cuando la empresa era pequeña puede haber sido perfectamente adecuada en ese momento. El problema aparece cuando la empresa cambia, pero algunas de las formas de organizar el trabajo permanecen prácticamente iguales.\nEntonces empiezan a aparecer situaciones que, tomadas de manera aislada, parecen pequeñas.\nUna persona no sabe si una determinada decisión le corresponde a ella o a su jefe. Un equipo necesita información que está en otra área y no está claro quién debe proveérsela. Una tarea que durante años estuvo en manos de una persona se incorpora a otro puesto cuando esa persona se va, pero nadie revisa qué otras responsabilidades ya tiene quien la recibe. Alguien empieza a hacer algo porque “siempre se hizo así”, aunque ya nadie recuerde por qué.\nY cuando estas situaciones se multiplican, la organización empieza a depender demasiado de las personas y demasiado poco de una estructura que permita que el trabajo avance.\nNo estoy hablando de burocratizar una empresa ni de llenar de documentos cada actividad. Estoy hablando de algo mucho más sencillo: hacer explícito aquello que la organización necesita que todos puedan comprender para poder trabajar.\nCuando una organización crece, parte de aquello que antes podía resolverse informalmente necesita quedar disponible de una manera que facilite el trabajo. Puede ser una descripción de puesto, un procedimiento, un manual de operaciones, un instructivo o cualquier otra forma que resulte adecuada para esa organización. El formato no es lo importante. Lo importante es que ese documento sea una herramienta para trabajar.\nQue permita comprender qué se espera, cómo se realiza una tarea, qué responsabilidades están involucradas, con quién hay que coordinarse o qué hacer ante determinadas situaciones, sin que todo dependa de que haya alguien disponible para explicarlo.\nY para que realmente cumpla esa función, tiene que ser un documento vivo. Tiene que poder consultarse en la diaria, ser comprendido por quienes lo necesitan y revisarse cuando la organización cambia.\nPorque un documento que se escribe, se aprueba y queda guardado no necesariamente facilita el trabajo. Si la organización cambia y el documento sigue describiendo una realidad que ya no existe, puede terminar agregando confusión en lugar de claridad.\nEn cambio, cuando acompaña la forma en que la organización trabaja, cuando está disponible para quienes lo necesitan y cuando se revisa a medida que esa realidad cambia, ese documento pasa a formar parte de la estructura.\nPorque una estructura no se sostiene solamente en el organigrama. También se sostiene en la claridad con la que las personas pueden comprender qué tienen que hacer, cómo se relacionan con los demás y qué decisiones pueden tomar para que el trabajo avance.\nY ahí es donde la estructura empieza a tener relación directa con la estrategia.\nSupongamos dos organizaciones que llegaron a un punto similar. Ambas crecieron, ambas necesitan modificar su estructura y ambas deciden hacerlo.\nEn la primera, se diseña una nueva estructura, se redefinen puestos y responsabilidades y se comunica el cambio. Durante un tiempo parece que todo funciona. Sin embargo, cuando aparecen situaciones que no estaban previstas, las personas vuelven a recurrir a quienes históricamente tomaban las decisiones. Los nuevos roles existen, pero las decisiones siguen circulando por los mismos lugares.\nLa organización cambió en el papel, pero no terminó de cambiar en la práctica.\nEn la segunda, el cambio se aborda entendiendo que modificar la estructura implica modificar también comportamientos, relaciones y formas de decidir. Se construye un sentido compartido acerca de por qué es necesario cambiar, se identifican las personas que pueden impulsar ese proceso, se trabaja sobre los obstáculos que aparecen y se generan resultados que permiten comprobar que la nueva forma de trabajar funciona.\nEs allí donde el aporte de Kotter resulta interesante. Sus ocho pasos para conducir procesos de transformación no se reducen a comunicar un cambio. Incluyen generar sentido de urgencia, reunir a quienes pueden impulsarlo, comunicar una visión, remover obstáculos, generar logros de corto plazo y, finalmente, incorporar los nuevos enfoques a la manera habitual de trabajar.\nEl cambio no termina cuando se modifica la estructura. Termina cuando la organización logra funcionar de acuerdo con ella.\nY esto también explica por qué algunos cambios que parecen razonables no consiguen sostenerse.\nPodemos diseñar una estructura que, en teoría, distribuye mejor las responsabilidades. Podemos crear nuevos puestos, definir nuevos procesos y establecer nuevos niveles de decisión. Pero si las personas siguen actuando con las reglas anteriores, si los responsables no tienen la autoridad necesaria para decidir o si la información continúa concentrada donde estaba antes, la estructura nueva va a convivir con la vieja.\nDurante un tiempo pueden existir las dos. Y esa convivencia suele generar más confusión que claridad. Porque una organización que creció necesita algo más que sumar personas.\nNecesita transformar conocimiento individual en conocimiento organizacional.\nNecesita dejar de depender de aquello que alguien recuerda, de lo que alguien aprendió hace diez años o de la persona que siempre estuvo ahí y sabe cómo resolverlo.\nNo porque esas personas no sean importantes. Al contrario. El conocimiento que construyeron es parte del capital de la organización.\nPero si ese conocimiento solamente existe en ellas, la organización queda expuesta cada vez que alguien se va, cambia de puesto, se jubila o simplemente no está disponible.\nLa estructura también se construye haciendo visible ese conocimiento y poniéndolo a disposición de quienes necesitan utilizarlo.\nPor eso, cuando una organización crece, una de las preguntas que debería hacerse no es solamente cuánto más puede crecer, sino qué necesita cambiar para poder sostener ese crecimiento.\nUna empresa de cinco personas no necesita organizarse de la misma manera que una de trescientas. Lo que funcionó en una etapa puede dejar de ser suficiente en otra, y revisar la estructura no implica descartar todo lo construido, sino reconocer qué necesita ser adaptado para que la organización pueda seguir avanzando.\nLa estructura no acompaña a la estrategia cuando está dibujada en un organigrama. La acompaña cuando permite que la organización funcione de acuerdo con lo que decidió hacer.\n¿La estructura de tu organización acompaña la empresa que tenés hoy o todavía responde, en parte, a la empresa que alguna vez fueron?\n---\nAndrea De Vicenzo\nConsultora en Diseño Organizacional\nEl Rugido Interior es un espacio para compartir ideas y reflexiones sobre cómo diseñar organizaciones más claras, humanas y sostenibles."}, {"id": "4", "title": "El mismo problema no siempre necesita la misma solución", "date": "2026-08-03", "body": "Dos empresas familiares, con actividades similares y ambas en manos de la segunda generación.\nEn las dos aparecían dificultades para coordinar tareas entre diferentes áreas, personas que pedían mayor autonomía para tomar decisiones pero seguían consultando cuestiones operativas, una comunicación principalmente oral e informal y cierta sensación de que las posibilidades de crecer dentro de la organización eran limitadas.\nA simple vista, los problemas se parecían bastante.\nSin embargo, cuando se profundizaba un poco más, las diferencias empezaban a aparecer.\nEn una de las empresas, distintos integrantes de la familia estaban al frente de diferentes áreas y cada uno conducía con sus propios criterios. No había una mirada compartida sobre algunas cuestiones centrales de la gestión de personas y tampoco una función de Recursos Humanos desarrollada más allá de las tareas vinculadas con la administración del personal.\nEn la otra, las decisiones a nivel estratégico respondían a criterios acordados, existía un Protocolo Familiar y había una visión común que orientaba a los distintos líderes. Recursos Humanos tenía un lugar reconocido por la dirección, aunque su función no siempre resultara clara para quienes trabajaban en la empresa.\nLos síntomas podían parecer similares, pero lo que los sostenía era diferente.\nCon los años, este patrón resultó tan evidente que llevó a corroborarlo con nuevas preguntas y observaciones. Encontrar algo que se repite ayuda a saber dónde mirar, pero no necesariamente explica lo que está pasando.\nUna organización donde las personas consultan cada decisión puede tener un problema de centralización. Pero también puede ocurrir que nadie haya definido con claridad qué decisiones puede tomar cada uno, que existan criterios diferentes según quién esté a cargo o que una mala experiencia del pasado haya sumado controles que todavía permanecen.\nDesde afuera, probablemente veamos lo mismo: falta de autonomía. Sin embargo, por debajo pueden estar ocurriendo cosas completamente diferentes.\nAlgo similar sucede con los problemas de coordinación. Es frecuente escuchar frases como “yo le avisé”, “le mandé un correo”, “se lo pedí varias veces” o “eso le corresponde a otra área”.\nLa primera conclusión podría ser que existe un problema de comunicación. Y a veces lo hay.\nPero cuando se profundiza aparecen pedidos que nunca fueron claros, responsabilidades que se superponen, tareas cuyo responsable nadie puede identificar con certeza o áreas que trabajan con prioridades diferentes porque nunca se estableció un criterio común.\nEntonces, la comunicación empieza a ser sólo una parte del problema.\nTambién ocurre con la desmotivación. Personas que dicen no sentirse escuchadas, que no encuentran posibilidades de crecimiento o que consideran que sus aportes no son tenidos en cuenta pueden aparecer en organizaciones con características muy diferentes.\nLa respuesta inmediata podría ser pensar en reconocimiento, capacitación, beneficios o actividades destinadas a mejorar el clima. Quizás alguna de esas acciones sea necesaria, pero difícilmente alcance si el origen está en otro lugar.\nSi una persona pide autonomía pero cada decisión que toma es revisada por alguien de mayor jerarquía, probablemente el problema no sea la motivación. Si no puede crecer porque la estructura no tiene definidos roles ni posibilidades de desarrollo, probablemente tampoco.\nY si dos áreas entran permanentemente en conflicto porque nadie definió dónde termina la responsabilidad de una y comienza la de la otra, un taller de comunicación puede aportar herramientas, pero no va a resolver aquello que la organización dejó sin definir.\nProblemas que se parecen no necesariamente tienen las mismas causas. Y cuando las causas son diferentes, las soluciones también deberían serlo.\nTal vez por eso una solución que funciona muy bien en una organización puede no producir el mismo resultado cuando intenta replicarse en otra.\nUna nueva estructura, un procedimiento, una capacitación, un sistema, una encuesta de clima o una metodología pueden ser buenas herramientas. La pregunta es qué problema vienen a resolver.\nPorque reconocer un patrón ayuda a orientar la mirada. Permite hacer mejores preguntas, buscar relaciones, contrastar lo que las personas dicen con lo que efectivamente ocurre y encontrar las huellas que fueron dejando decisiones tomadas en distintos momentos de la organización.\nPero el patrón no es el diagnóstico. Mucho menos la solución.\nDos organizaciones pueden llegar al mismo lugar por caminos completamente diferentes. Entender qué camino recorrió cada una probablemente sea lo que permita decidir por dónde empezar a cambiarlo.\n¿Cuántas veces intentamos resolver un problema porque se parece a otro que ya conocemos, antes de preguntarnos si realmente tiene la misma causa?\nAndrea De Vicenzo\nConsultora en Diseño Organizacional\nEl Rugido Interior es un espacio para compartir ideas y reflexiones sobre cómo diseñar organizaciones más claras, humanas y sostenibles."}, {"id": "5", "title": "Antes de cambiar una organización, hay que comprenderla.", "date": "2026-07-01", "body": "Hay una pregunta que me acompaña desde hace años.\nNo surgió en una clase, ni en un libro, ni cuando decidí dedicarme al diseño organizacional. Fue apareciendo mientras recorría organizaciones desde adentro: revisando procesos, participando en auditorías, conversando con personas de distintas áreas y tratando de entender por qué, frente a un mismo desafío, dos empresas podían reaccionar de maneras completamente diferentes.\nLa pregunta es sencilla.\n¿Por qué esta organización funciona así?\nPuede parecer obvia, pero rara vez es la primera que aparece cuando una organización enfrenta un problema.\nLo habitual es que la conversación empiece por las soluciones. Revisar un proceso, redefinir responsabilidades, incorporar un sistema, modificar una estructura o resolver un conflicto entre áreas. Y, en la mayoría de los casos, esas decisiones son necesarias. Cuando la operación se frena, un cliente espera una respuesta o cambia una regulación, no hay demasiado margen para la contemplación. Hay que actuar.\nEl problema no está en resolver lo urgente. El problema aparece cuando la urgencia se convierte en la única forma de gestionar.\nCon el tiempo, la organización entra en una lógica donde siempre hay algo que resolver, pero casi nunca hay espacio para preguntarse por qué ese problema apareció. Se apaga un incendio y enseguida aparece otro. La empresa sigue funcionando, las personas hacen un enorme esfuerzo para que las cosas salgan y el negocio continúa. Sin embargo, debajo de esa capacidad de respuesta suelen quedar preguntas que nadie tiene tiempo de hacerse.\nY es ahí donde mi trabajo empieza a tomar otro sentido.\nSi una organización llegó hasta este punto funcionando de determinada manera, difícilmente sea por casualidad. Esa forma de trabajar fue construyéndose a partir de decisiones que, en su momento, respondieron a una necesidad concreta. Algunas permitieron crecer. Otras ayudaron a atravesar una crisis. Otras simplemente fueron la mejor respuesta posible con los recursos y la información disponibles en ese momento.\nEso no significa que hoy sigan siendo las decisiones adecuadas.\nSignifica que, antes de cambiarlas, quiero entender qué estaban resolviendo.\nEsa forma de mirar también cambió mi manera de analizar los procesos.\nDurante mucho tiempo pensé que un proceso hablaba del trabajo que realizaba un área. Hoy me resulta imposible verlo de esa manera. Detrás de cada proceso encuentro decisiones, responsabilidades que fueron cambiando con los años, conversaciones que nunca llegaron a darse, acuerdos que se construyeron para seguir adelante y, muchas veces, personas que terminaron sosteniendo con esfuerzo aquello que la organización todavía no había logrado ordenar.\nPor eso me cuesta creer en las soluciones aisladas.\nModificar un proceso puede mejorar una parte de la operación, pero también puede afectar la coordinación con otras áreas. Cambiar un rol puede agilizar una decisión y, al mismo tiempo, generar nuevas dependencias. Incorporar una herramienta puede resolver un problema operativo y crear otro si la organización no estaba preparada para integrarla.\nNada de eso convierte a las organizaciones en estructuras rígidas.\nAl contrario. Las organizaciones cambian porque cambian los mercados, las regulaciones, la tecnología, los clientes y las personas. Lo que ayer ayudó a sostener el negocio puede no alcanzar para responder a los desafíos de hoy.\nPor eso nunca entendí el diseño organizacional como un ejercicio para ordenar organigramas o documentar procesos.\nLo entiendo como una manera de ayudar a que una organización vuelva a encontrar coherencia entre la forma en que trabaja y los desafíos que tiene por delante, sin perder de vista la historia que la trajo hasta acá.\nTal vez esa sea la razón por la que, antes de pensar en soluciones, sigo volviendo a la misma pregunta.\n¿Por qué esta organización funciona así?\nTodavía no encontré una mejor forma de empezar.\n---\nEn las próximas ediciones de El Rugido Interior voy a compartir algunas de las ideas que fueron dando forma a esta manera de comprender las organizaciones. No pretenden ser recetas ni respuestas universales. Son principios que nacieron de la práctica, de los aciertos y también de los errores, y que hoy orientan cada intervención que realizo.\n---\n¿Cuándo fue la última vez que, frente a un problema en tu organización, alguien se detuvo a preguntarse por qué apareció y no solamente cómo resolverlo?\nMe interesa leer tu mirada.\n---\nAndrea De Vicenzo\nConsultora en Diseño Organizacional\nEl Rugido Interior es un espacio para compartir ideas y reflexiones sobre cómo diseñar organizaciones más claras, humanas y sostenibles.\n#DiseñoOrganizacional #GestiónOrganizacional #EstrategiaEmpresarial #Procesos #MejoraContinua #EmpresasFamiliares #Liderazgo #Consultoría #Organizaciones #AndreaDeVicenzoConsultora"}, {"id": "6", "title": "El peso de las palabras", "date": "2026-06-01", "body": "Lo que decimos, lo que no decimos y lo que eso construye adentro de las organizaciones\n\n\nNoviembre de 2024. Al terminar un taller de Comunicación para la Acción, uno de los líderes se acercó y dijo algo que todavía me queda dando vueltas: \"Me acabo de dar cuenta de que no sabía pedir.\"\n\n\nNo era un líder nuevo. Llevaba más de 20 años en la empresa y alrededor de diez coordinando un sector complejo, con personas de larga trayectoria en la empresa y una operación exigente. Sin embargo, en algo tan básico como formular un pedido, había un problema enorme que nunca había llegado a la superficie.\n\n\nLos pedidos aparecían incompletos. Sin plazos. Sin una definición clara de qué se esperaba. Sin condiciones mínimas de satisfacción. Cuando los pedidos son ambiguos, cada uno empieza a resolver como puede: dependencia constante, consultas que no terminan, retrabajo, equipos que sienten que nada se resuelve, líderes que no pueden soltar la operación porque todo vuelve a ellos.\n\n\nLo que más me llamó la atención no fue el problema en sí, sino su origen. No era falta de compromiso ni de capacidad. Era que nadie le había enseñado a coordinar acciones de manera consciente. Durante años había aprendido a resolver sobre la marcha, absorbiendo urgencias y sosteniendo la operación como podía. Igual que la mayoría de los líderes que conozco.\n\n\nPorque coordinar acciones no es lo mismo que hablar. Es poner el foco en el problema real. Es definir qué se necesita resolver y qué necesita saber el otro para actuar. Es mirar lo que pasó no para quejarse, sino para aprender y corregir. Nada de eso funciona si las conversaciones siguen siendo improvisadas.\n\n\n---\n\n\nCon el tiempo empecé a notar que muchas de las tensiones más desgastantes dentro de las organizaciones no nacen de grandes conflictos. Nacen de conversaciones mal diseñadas. Palabras aparentemente pequeñas que, dichas todos los días, terminan armando formas completas de trabajar.\n\n\n[Imagen original del artículo: El peso de las palabras. Enlace aportado por la autora]\n\n\nEl urgente no es el problema. Es el síntoma de miles de cosas pequeñas que no se revisaron a tiempo porque alguien creyó que eran menores, hasta que un día todo aparece junto, como un ovillo de lana enredado que ya no sabés de qué punta tirar.\n\n\nEn otra ocasión, un líder presentó una propuesta transversal dentro de su organización. La respuesta era siempre parecida: \"Vamos bien.\" \"Lo está viendo el Directorio.\" \"Más adelante lo retomamos.\" Pasaron meses. El problema no fue la demora sola, sino el silencio que la acompañó. Sin claridad real sobre lo que estaba pasando, ese líder fue construyendo una expectativa que el tiempo fue alimentando, hasta que llegó una devolución completamente distinta a lo que había imaginado.\n\n\nNo sufrió solo por lo que ocurrió. Sufrió por lo que no podía interpretar.\n\n\nY ahí está la trampa. Muchas organizaciones confunden movimiento con avance. Hay reuniones, hay respuestas, hay señales. Pero sin claridad real, todo eso es ruido. El lenguaje ambiguo sostiene esa ilusión durante meses.\n\n\n---\n\n\nEsto también tiene una dimensión personal que me parece importante no eludir. Cuando alguien siente que perdió el control sobre su trabajo o sobre su lugar en una organización, la causa suele atribuirse afuera: la empresa, los jefes, la coyuntura. A veces es así. Pero muchas veces, una parte del problema está sostenida por conversaciones que esa misma persona nunca terminó de revisar. Pedidos que no hizo con claridad. Expectativas que nunca chequeó. Silencios que interpretó como señales positivas porque era más cómodo que preguntar de nuevo.\n\n\nNo lo digo para culpar a nadie. Lo digo porque es la pregunta más incómoda y también la más útil.\n\n\n---\n\n\nLa pregunta para este mes:\n\n\n¿Cuántas de las cosas que hoy sentís fuera de tu control también están sostenidas por conversaciones que nunca terminaste de revisar?\n\n\nNo las conversaciones difíciles con otros. Las internas.\n\n\nLas que moldean lo que esperás, lo que pedís y aquello que seguís sosteniendo sin haberlo puesto realmente en palabras.\n\n\nAndrea De Vicenzo · Consultora en Diseño Organizacional\n\n\n#DiseñoOrganizacional #Liderazgo #ComunicaciónOrganizacional #CulturaOrganizacional"}, {"id": "7", "title": "El trabajo no falla. Falla cómo está organizado.", "date": "2026-05-02", "body": "El 1° de mayo suele estar asociado a una narrativa conocida: el esfuerzo, el compromiso, el reconocimiento al trabajador. Es una mirada necesaria, pero parcial. Hay una dimensión que queda sistemáticamente fuera de foco y que, sin embargo, condiciona todo lo demás: el diseño del trabajo dentro de las organizaciones.\nEn la práctica, lo que se observa con frecuencia no es falta de voluntad ni de capacidad. Por el contrario, los equipos suelen estar comprometidos, activos, incluso sobreexigidos. Y aun así, aparecen fricciones que se repiten con una regularidad llamativa, independientemente del sector o del tamaño de la empresa.\nEquipos que interactúan de manera constante, pero sin lograr una comprensión compartida. Tareas que no están claramente definidas ni asignadas. Responsabilidades que se diluyen en la operación diaria. En ese contexto, el sistema tiende a resolverse de dos maneras: hay actividades que no asume nadie o terminan concentrándose en quienes no deberían estar ocupándose de ellas.\nFrente a estas situaciones, la respuesta más habitual no es revisar el diseño organizacional, sino intervenir sobre las personas. Se incrementan las instancias de coordinación, se refuerzan los controles, se exige mayor esfuerzo individual.\nEs una lógica que, en el corto plazo, puede sostener el funcionamiento, pero que en el mediano plazo incrementa la complejidad y el desgaste.\nEn paralelo, se consolida una brecha interna. Mientras la alta dirección se enfoca en decisiones estratégicas vinculadas al crecimiento y al negocio - lo cual resulta legítimo y necesario- , los niveles intermedios absorben una parte significativa de las ineficiencias del sistema. La consecuencia es un desplazamiento del rol:\nquienes deberían estar coordinando, priorizando y habilitando el trabajo de otros, terminan gestionando desvíos y resolviendo urgencias.\nEste corrimiento no siempre es evidente en los indicadores tradicionales. Sin embargo, se manifiesta en decisiones que se postergan, en retrabajos, en conversaciones que se reiteran sin llegar a resolverse y en oportunidades que no logran materializarse. Es un costo operativo que se acumula de manera silenciosa.\nEn muchos casos, el problema no reside en las personas, sino en la forma en que el trabajo está estructurado. La ausencia de claridad en la distribución de responsabilidades, la superposición de roles, la falta de criterios explícitos para la toma de decisiones y la desconexión entre áreas generan un entorno donde el esfuerzo se destina, en gran medida, a compensar fallas del sistema.\nEn este punto, la afirmación resulta directa:\nlo que no se ordena en la estructura, se paga en la operación.\nRevisar el diseño organizacional no implica necesariamente transformaciones radicales ni reconfiguraciones totales. Implica, en muchos casos, volver a mirar con mayor profundidad cómo se están tomando las decisiones, cómo se priorizan los problemas y cómo se organiza el trabajo cotidiano. Es allí donde se define, en gran medida, la calidad del funcionamiento.\nEl Día del Trabajador invita a reconocer a las personas. Quizás también sea una oportunidad para revisar las condiciones en las que ese trabajo ocurre.\nPorque cuando el diseño acompaña, el esfuerzo deja de ser un mecanismo de compensación y se convierte en un verdadero generador de valor.\nAndrea De Vicenzo\nConsultora en Diseño Organizacional\n#DiseñoOrganizacional #Liderazgo #Gestión #CulturaOrganizacional #Eficiencia #Trabajo #Organizaciones"}, {"id": "8", "title": "Cuando mejorar no alcanza", "date": "2026-04-01", "body": "Todos los años pasaba lo mismo.\nSe armaban equipos multidisciplinarios para abordar un problema que atravesaba a toda la organización. El punto de partida era claro: no había un proceso definido, cada área resolvía como podía y eso generaba pérdidas de tiempo constantes.\nEl objetivo también era claro: ordenar.\nLas reuniones comenzaban con foco. Se describía el problema, se compartían ejemplos, había acuerdo en que así no se podía seguir.\nPero a medida que avanzaban, algo empezaba a cambiar.\nEl foco se diluía.\nEn lugar de profundizar en las causas, aparecían soluciones aisladas. En lugar de construir una mirada común, surgían diferencias entre áreas.\n“Nos llega todo explotado.” “Nos ocupamos de todo.” “Esto siempre fue así.”\nLa conversación se desplazaba. El problema dejaba de ser el proceso y pasaba a ser lo que cada uno hacía —o no hacía— dentro de él.\nHabía muchos jefes participando. Sin embargo, nadie asumía la responsabilidad de ordenar lo que estaba pasando. Las decisiones quedaban en pausa, a la espera de una validación externa o de alguien con mayor jerarquía.\nMientras tanto, operaban otros factores menos visibles. En algunas áreas, especialmente las más vinculadas a lo financiero, aparecía el miedo a equivocarse: a que falle un control, a que una decisión tenga consecuencias, a quedar expuesto frente a una auditoría.\nEse contexto hacía que avanzar fuera más difícil.\nIntentos de mejora había. Ideas también. Se repetían los “habría que”, se proponían cambios, incluso en algunos casos se definían acciones concretas.\nPero no había una metodología que ordenara ese trabajo.\nNo siempre se definían objetivos claros, ni se priorizaban problemas, ni se hacía seguimiento de lo acordado. Algunos sectores cumplían, otros no. Lo que funcionaba no se estandarizaba. Lo que no funcionaba volvía a aparecer.\nEl sistema, con el tiempo, regresaba al mismo punto.\nEn ese contexto aparece una pregunta relevante:\n¿por qué un equipo que quiere mejorar no logra sostener mejoras?\nEn la práctica, lo que se observa es que cada área tiende a operar desde su propia lógica. Se defienden posiciones, se busca resolver la parte que impacta directamente, se espera que el cambio se origine en otro lugar.\nLa conversación se orienta más a identificar responsables que a entender causas. Las soluciones aparecen antes que el problema esté bien definido. Y lo que se acuerda no siempre se traduce en decisiones concretas.\nSin un proceso que permita entender qué está pasando, probar alternativas, ajustar y sostener lo que funciona, las mejoras quedan en intención.\nCon el tiempo, esto deja de ser un problema puntual y pasa a ser una forma de funcionamiento.\nSe repiten las discusiones. Se reabren los mismos temas. Se vuelve a intentar.\nY el sistema no incorpora aprendizaje.\nLa pregunta, entonces, no es si la organización quiere mejorar.\nEs si tiene las condiciones para aprender de lo que le pasa y transformar eso en una forma distinta de operar."}, {"id": "9", "title": "La incomodidad de mirar", "date": "2026-03-02", "body": "¿Estamos realmente preparados para reconocer lo que no está funcionando? ¿O preferimos sostener la queja mientras todo sigue igual?\n\n\nEn muchas organizaciones la queja circula con facilidad. Se comenta en pasillos, se menciona en reuniones, se instala en conversaciones informales. Hay conciencia de que algo no fluye del todo. Que ciertas decisiones no terminan de dar resultado. Que determinadas tensiones se repiten.\n\n\nSin embargo, reconocer que algo está mal no es lo mismo que estar dispuesto a mirarlo en profundidad.\n\n\nPorque mirar en serio implica hacerse cargo de preguntas menos cómodas. Implica revisar cómo estamos decidiendo. Qué responsabilidades están claras y cuáles no. Qué conversaciones estamos evitando. Desde qué criterios estamos priorizando.\n\n\nLa queja descarga tensión. La revisión genera transformación.\n\n\nEn mi trabajo acompañando procesos organizacionales veo con frecuencia este punto de inflexión: la organización funciona, no está en crisis, pero acumula fricciones. Y mientras esas fricciones se explican como problemas individuales o circunstanciales, todo sigue más o menos igual. Cuando se empieza a revisar el encuadre —la estructura de decisiones, los criterios implícitos, las responsabilidades superpuestas— el panorama cambia.\n\n\nNo porque aparezca una solución mágica. Sino porque se deja de actuar sobre síntomas y se empieza a intervenir sobre causas.\n\n\nReconocer lo que no está funcionando no es un acto de debilidad. Es un gesto de madurez organizacional. Exige más liderazgo que la reacción rápida y más criterio que la urgencia.\n\n\nTal vez la pregunta no sea solamente qué está mal. Tal vez la pregunta sea: ¿estamos dispuestos a revisar desde dónde estamos mirando?\n\n\nMarzo puede ser un buen mes para empezar por ahí.\n\n\nAndrea De Vicenzo\n\n\nConsultora en Diseño Organizacional"}, {"id": "10", "title": "Tomar la posta: cuando las acciones revelan el compromiso", "date": "2026-02-02", "body": "Transformar de verdad es tomar la posta. Es hacerse cargo. Es animarse a revisar no solo lo que quiero, sino qué estoy haciendo para lograrlo… y para qué.\nMuchas veces nos llenamos de ideas fantásticas sobre lo que queremos para nuestras vidas. Damos algunos pasos —a veces tímidos— y seguimos adelante. Pero cuando miramos los resultados, aparece una sensación extraña.\nY no hablo solo de si alcanzamos o no eso que queríamos. Hablo de algo más profundo:\n👉 ¿Cómo me sentí en el proceso? 👉 ¿Coordiné acciones con otros o avancé en soledad? 👉 ¿Se generaron vínculos nuevos y más sanos?\nCuando esas respuestas no cierran, suele aparecer una pista clara: algo faltó en las acciones.\nDonde están tus acciones, está tu compromiso\nHay una verdad simple —y a veces incómoda—: donde están tus acciones, está tu compromiso real.\nSi digo “quiero recibirme”, necesito sentarme a estudiar. Si quiero aprender a manejar, necesito horas de práctica.\nEsas metas no se alcanzan solo con deseo, ni con buenas intenciones. Tampoco se logran si me disperso en mil actividades que nada tienen que ver con el objetivo final.\nNo es falta de capacidad. Muchas veces es falta de foco, de coherencia y de acción sostenida.\nLa brújula y el camino\nDefinir un objetivo es importante. Saber qué significa para mí, para cuándo lo quiero y por qué lo elijo. El objetivo funciona como una brújula: orienta, tracciona, invita al movimiento.\nPero la brújula sola no alcanza. También necesito un plan de viaje.\nPlanificar no es cumplir a rajatabla. Es decirle a mi mente, a mi cuerpo y a todo mi ser cuáles son las posibles alternativas. Es anticipar escenarios, prepararme, y ganar flexibilidad.\nY es justamente en el movimiento donde ocurre lo más valioso: aprendo, ajusto, cambio, crezco.\nObjetivo. Plan. Acción. Aprendizaje. Mejora.\nHay un ciclo simple que nos sostiene incluso en los momentos difíciles:\nDefino un objetivo. Planifico. Actúo. Reflexiono. Aprendo. Mejoro.\nEste esquema no solo impulsa resultados. También construye confianza.\nPorque cuando recuerdo que en otro momento pude, descubro que en este también podré.\nDe lo personal a lo organizacional\nEsto mismo sucede en las organizaciones.\nLas culturas que aprenden no son las que nunca se equivocan, sino las que revisan lo que hacen, reconocen errores, levantan la mano a tiempo y ajustan el rumbo.\nPor eso es clave invertir en habilidades humanas, en mejora continua y en espacios que habiliten conversaciones honestas. Ahí nacen los equipos sinérgicos: los que coordinan acciones, cuidan los vínculos y saben girar el timón cuando hace falta.\n🦁 El Rugido Interior\nTransformar no es esperar que algo pase. Es animarse a tomar la posta, una y otra vez.\nCon coraje y escucha, Andrea\n#ElRugidoInterior #Compromiso #Acción #MejoraContinua #CulturaOrganizacional #Aprendizaje"}, {"id": "11", "title": "El valor de lo que ya hicimos", "date": "2026-01-05", "body": "📅 Enero trae ese aire de reinicio. Pero empezar de nuevo no es borrar el pasado: es integrar lo aprendido y mirar hacia adelante con más claridad.\nA veces creemos que reinventarnos implica cambiarlo todo. En realidad, se trata de recordar quiénes somos, revisar nuestros valores, y reconectar con la misión y la visión que dan sentido a nuestras acciones.\n💡 De la pausa al propósito\nLas pausas también son parte del camino. Sirven para observarnos, reconocer lo que ya no queremos repetir y preguntarnos qué sí queremos sostener. Reinventarse es un acto de conciencia: no se trata de empezar distinto, sino de empezar más alineado.\n🌱 Ejercicio de comienzo\nTomate unos minutos y respondé:\n1. ¿Qué quiero conservar de mi 2025?\n2. ¿Qué quiero dejar atrás definitivamente?\n3. ¿Qué valores quiero que guíen mis decisiones este año?\n4. ¿Qué visión me inspira a seguir creciendo?\n🦁 El Rugido Interior\nRenacer no es un salto al vacío, es volver a elegir desde lo aprendido.\nCon coraje y escucha, Andrea\n#Renovación #LiderazgoConsciente #ElRugidoInterior #Valores #Propósito"}, {"id": "12", "title": "Cierre con sentido: de la incoherencia al protagonismo", "date": "2025-12-01", "body": "Diciembre suele ser tiempo de balances. En lo personal y en lo organizacional, es cuando más se notan las incoherencias: entre lo que pensamos, decimos y hacemos.\n✨ La coherencia es simple de definir, pero desafiante de practicar.\nEn muchas organizaciones escucho frases como:\n“Acá nada cambia” o “Nadie hace nada”.\nPero cuando aparece una oportunidad para proponer, aprender o involucrarse… surge el freno. Esperamos que otros actúen, investiguen o tomen la iniciativa. Y cuando lo hacen, muchas veces los criticamos por no haberlo hecho “a nuestra manera”.\nTambién pasa con la queja del “estoy para más”, que a veces convive con el “eso no me corresponde”. Y ahí aparece la brecha entre el discurso y la acción.\nEsa brecha no es un juicio: es un espejo. Nos muestra cuánto nos cuesta pasar del reclamo a la responsabilidad, de la espera a la acción, del rol de víctima al de protagonista.\n🌱 La transformación cultural empieza en ese pequeño movimiento: cuando dejamos de hablar del cambio como algo externo y empezamos a encarnarlo, desde nuestras propias decisiones.\n💡 Te propongo cerrar el año con tres preguntas:\n- ¿Dónde noto incoherencia entre lo que pienso, digo y hago?\n- ¿Qué acción puedo tomar para achicar esa distancia?\n- ¿Qué conversación pendiente podría abrir un nuevo comienzo?\n🦁 Cerrar con sentido es elegir la coherencia, incluso cuando cuesta. Porque cada elección coherente es un acto de liderazgo.\nCon coraje y escucha, Andrea\n#ElRugidoInterior #TransformaciónCultural #LiderazgoConsciente #CierreConSentido"}, {"id": "13", "title": "Liderazgo para la Transformación: de la teoría a la práctica", "date": "2025-11-03", "body": "En mi proyecto final de Maestría, aprobado en 2022, escribí una frase que aún hoy resuena con fuerza:\n“La gerencia tradicional no basta”.\nLo que en ese momento era una reflexión académica, hoy se ha convertido en una brújula en mi vida laboral y personal. Porque liderar no es solo gestionar. Liderar para la transformación implica movilizar, inspirar, generar confianza y abrir caminos hacia lo nuevo.\n💡 Del aula a la vida real\nHace unos años, lo veía como una teoría respaldada por autores y marcos de referencia. Hoy, lo vivo como una práctica cotidiana:\n- En cada feedback que abre posibilidades.\n- En cada conversación que despierta motivación.\n- En cada decisión que conecta propósito con acción.\nEl liderazgo transformador no se trata de carisma o entusiasmo solamente. Se trata de la capacidad de encender algo en otros y de sostener el cambio a través de vínculos genuinos.\n🌱 Una experiencia personal\nLo que más me impresiona es cómo los aprendizajes no se quedan en el papel. Un escrito de hace tres años sigue interpelándome, se cuela en mis reuniones, en mis proyectos y en la forma en la que acompaño a líderes y equipos.\nPorque al final, liderar no es repetir fórmulas: es escuchar, accionar y transformar juntos.\n✨ Ejercicio para vos\nTe invito a una pausa de 5 minutos:\n1. Recordá un aprendizaje clave de tu historia (puede ser de un curso, de un libro, de una conversación).\n2. Preguntate: ¿cómo impacta todavía en quién soy y en quién quiero ser como líder?\n3. Identificá una acción concreta que podrías llevar a tu presente para fortalecer tu manera de liderar.\n🦁 El Rugido Interior\nEste newsletter no es sobre mirar atrás con nostalgia, sino sobre reconocer que las semillas plantadas tiempo atrás hoy florecen de nuevas maneras.\n💭 ¿Qué aprendizaje del pasado sigue inspirando tu liderazgo actual?\nCon coraje y escucha, Andrea\n#TransformaciónCultural #Liderazgo #ElRugidoInterior"}, {"id": "14", "title": "Escuchar para rugir: el poder del feedback auténtico", "date": "2025-10-01", "body": "El rugido interior no es grito ni imposición: es animarse a expresar con coraje lo que vemos, y hacerlo desde la escucha profunda. Ahí es donde el feedback deja de ser trámite y se vuelve transformación.\n\n\nEl Rugido Interior: por qué este nombre\n\n\nCuando pensamos en un rugido, solemos imaginar algo estridente, que se escucha a kilómetros. Pero para mí, el rugido también puede ser esa voz interior que, aun suave, no se apaga. Es la fuerza que nos recuerda quiénes somos, lo que queremos, y lo que estamos dispuestos a transformar. Por eso elegí este nombre para este espacio: un lugar para compartir reflexiones y herramientas que nos ayuden a escucharnos, crecer y cambiar.\n\n\n---\n\n\nFeedback que transforma\n\n\nDar y recibir feedback es una de las prácticas más poderosas para crecer, pero también una de las más temidas. Muchas veces lo asociamos con “crítica”, con sentirnos evaluados o enjuiciados. Y sin embargo, cuando el feedback se da desde un lugar de respeto y apertura, se convierte en un motor de transformación cultural.\n\n\nLo que he visto en equipos\n\n\n- Cuando el feedback se convierte en un hábito, la confianza crece.\n- Las conversaciones dejan de girar en torno al error, y empiezan a abrir posibilidades de mejora.\n- La gente descubre que puede pedir ayuda sin miedo.\n- Los líderes aprenden a escuchar de verdad, más allá de sus supuestos.\n\n\n---\n\n\nUna herramienta práctica\n\n\nLa próxima vez que des feedback, probá este esquema sencillo:\n\n\n1. Observación: describí lo que viste/escuchaste sin juzgar.\n2. Impacto: contá cómo eso repercutió en vos o en el equipo.\n3. Posibilidad: abrí la puerta a un futuro distinto.\n\n\nTe invito a reflexionar\n\n\n1. ¿Qué pasaría si en tu equipo el feedback fuera visto como un regalo, y no como una amenaza?\n\n\n2. ¿Qué conversación podrías abrir esta semana que ayude a crecer, a vos o a alguien más?\n\n\nDesde mi rugido interior,\n\n\nAndrea De Vicenzo\n\n\nMBA | Contadora Pública | Coach Ontológico Profesional\n\n\nPromotora de la mejora y del cambio cultural"}];const cards=document.getElementById('cards'),search=document.getElementById('search'),catalog=document.getElementById('catalog'),reader=document.getElementById('reader');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});function render(){const q=search.value.toLowerCase();let rows=entries.filter(x=>(x.title+' '+x.body).toLowerCase().includes(q));document.getElementById('count').textContent='('+rows.length+')';cards.innerHTML=rows.map(x=>`<div class="card"><div class="date">${fmt(x.date)}</div><h3>${esc(x.title)}</h3><div class="excerpt">${esc(x.body.replace(/\s+/g,' ').slice(0,170))}…</div><button type="button" class="read" data-id="${x.id}">Leer edición completa →</button></div>`).join('')||'<p>No encontramos ediciones con esa búsqueda.</p>'}function openArticle(id){const x=entries.find(y=>y.id===id);if(!x)return;document.getElementById('readingTitle').textContent=x.title;document.getElementById('readingDate').textContent=fmt(x.date);let box=document.getElementById('readingBody');box.replaceChildren();x.body.split(/\n\s*\n/).forEach(t=>{let p=document.createElement('p');p.textContent=t.trim();if(t.trim().length<77&&!/[.!?]$/.test(t.trim()))p.className='heading';box.appendChild(p)});catalog.style.display='none';reader.style.display='block';history.replaceState(null,'','#edicion-'+id);window.scrollTo(0,0)}function list(){reader.style.display='none';catalog.style.display='block';history.replaceState(null,'',location.pathname);window.scrollTo(0,0)}cards.addEventListener('click',e=>{const a=e.target.closest('[data-id]');if(a)openArticle(a.dataset.id)});search.addEventListener('input',render);document.getElementById('back').addEventListener('click',list);render();if(location.hash.startsWith('#edicion-'))openArticle(location.hash.replace('#edicion-',''));
</script></body></html>
