</head><body><header class="top"><a href="index.html" class="logo">ANDREA DE VICENZO</a><a href="index.html" class="back-site">← Volver al sitio</a></header><section class="hero"><div class="wide"><div class="eyebrow">Biblioteca editorial · Publicaciones de Andrea De Vicenzo</div><h1>Más Allá del Balance</h1><p>Historias y conversaciones sobre los múltiples caminos de una profesión.</p></div></section><main><section id="catalog"><div class="tools"><h2>Ediciones <span id="count" style="font-weight:400;color:#777;font-size:15px"></span></h2><input id="search" type="search" placeholder="Buscar artículos..." aria-label="Buscar artículos"></div><div class="cards" id="cards"></div></section><section id="reader"><button id="back" class="back" type="button">← Volver al listado</button><article><div class="tag">TEXTO COMPLETO · Más Allá del Balance</div><div id="readingDate" class="date" style="margin-top:20px"></div><h2 id="readingTitle"></h2><div id="readingBody" class="body"></div></article></section></main><footer>© Andrea De Vicenzo · Biblioteca de publicaciones</footer><script>
const entries=[{"id": "1", "title": "Lo que también nos forma", "date": "2026-10-07", "body": "Cuando pensé en esta segunda edición de Más Allá del Balance aparecieron muchos temas posibles. Podía hablar de normas de exposición y valuación, de auditoría, de la formación del contador o de tantos otros asuntos que atraviesan nuestra profesión.\n\n\nPero mientras pensaba por dónde seguir después de aquella primera edición, me encontré mirando hacia otro lado. No tanto hacia lo que hacemos, sino hacia lo que nos pasa mientras lo hacemos.\n\n\nMi primera experiencia laboral fue alrededor de los 20 años, armando cajas navideñas. Duró poco más de un mes y, si uno mirara mi currículum, probablemente ni siquiera tendría relevancia. Sin embargo, todavía puedo recordar aquella línea de producción completamente manual, en la que cada persona sabía qué tenía que hacer y cuándo para que el trabajo avanzara.\n\n\nMucho después estudié Administración de las Operaciones, leí sobre procesos, coordinación y Just in Time y pude ponerle nombres a muchas cosas que ya había visto funcionar frente a mí. Tal vez por eso, cuando miro hacia atrás, me cuesta pensar que alguna experiencia haya estado completamente alejada de mi formación profesional.\n\n\nDespués llegaría una fábrica de acoplados. Prestaba servicios a una automotriz y a una fábrica de autopartes, reparaba camiones y además fabricaba sus propios productos. En casi dos años hice un poco de todo: trabajé con el estudio que liquidaba impuestos y sueldos, hice órdenes de compra, registré facturas y recibos, me relacioné con bancos, facturé, cobré clientes y preparé mis primeros informes por unidades de negocio. También barrí, preparé café, encargué los regalos de fin de año y aprendí a atender tres celulares, dos Nextel y dos teléfonos fijos casi al mismo tiempo.\n\n\nTenía un Excel con las cobranzas y había empezado a ponerles caritas felices o tristes a los clientes según el trato que recibía cuando los llamaba (apenas pasaba mis 20 años). Me sabía muchos de sus teléfonos de memoria y todavía recuerdo haber logrado reducir un listado de siete páginas de deudores a una página y media.\n\n\nAprendí muchísimo. También me consumía. Mido 1,80 y llegué a pesar alrededor de 56 kilos.\n\n\nCon el tiempo uno también aprende que crecer, aprender y hacer bien un trabajo no significa necesariamente que ese sea un lugar en el que pueda o quiera quedarse.\n\n\nDespués entré como auxiliar contable y de tesorería en una empresa familiar vinculada a la venta de camiones y otras actividades. Pasé por impuestos, bancos y distintas tareas hasta llegar a ser auditora contable de casi todas las empresas del grupo. Fueron cerca de nueve años y probablemente ahí empecé a entender algo que después encontraría muchas veces: las organizaciones tienen historia y esa historia también interviene en las decisiones.\n\n\nPodemos mirar un número, detectar un desvío, revisar un procedimiento y elaborar un informe impecable, pero trabajamos con personas.\n\n\nNo todos los tiempos son propios, no todo cambia cuando uno cree que debería cambiar y, algunas veces, las cosas empiezan a moverse cuando uno cambia primero.\n\n\nHay aprendizajes que recién podemos nombrar mucho tiempo después de haberlos vivido.\n\n\nEn 2019 mi vida cambió bastante. Me enamoré, dejé Rosario y me vine a vivir a Entre Ríos. Cambié de ciudad, de trabajo y volví a empezar en otra empresa familiar, esta vez una concesionaria de autos.\n\n\nLlegué con una maestría terminada y un anteproyecto prácticamente listo que tardaría cuatro años más en animarme a presentar. Y cuando finalmente lo hice hubo directores y codirectores que, a fuerza de preguntas y con mucho respeto por aquello que yo quería construir, me ayudaron a darle forma. También, y no menos importante, mi marido que encontró las palabras exactas en el momento justo.\n\n\nEn esa empresa me encontré con Kaizen. Ya había intentado mejorar cosas en mis trabajos anteriores, aunque entonces probablemente no pensara demasiado en cómo llamar a eso. Esta vez había método, herramientas, una marca que lo respaldaba y una cultura preparada para trabajar de esa manera.\n\n\nLa auditoría, los informes y los números se me daban bien, pero cada vez me interesaba más otra cosa. Quería comprender por qué hacíamos las cosas de determinada manera, qué podíamos hacer diferente y qué necesitábamos para que una mejora pudiera sostenerse. También volví al coaching, algo que desde hacía tiempo sabía que quería hacer.\n\n\nHoy puedo unir esas cosas con bastante facilidad. En aquel momento no era tan evidente.\n\n\nCon los años mi idea de mejora también se fue ampliando. Kaizen forma parte de ella, pero no la explica por completo. Mejorar puede ser encontrar el paso más pequeño que puedo dar hoy y, al mismo tiempo, no perder de vista hacia dónde quiero ir. Es mirar procesos, personas, números e indicadores. Entender que existen diferentes maneras de hacer y también diferentes maneras de ser, y buscar cómo articularlas.\n\n\nA veces hace falta revisar un proceso. Otras veces hay que pensar una estructura, modificar una forma de trabajar, mirar un indicador, tener una conversación o simplemente comprender mejor aquello que tenemos delante antes de intentar cambiarlo.\n\n\nTambién aprendí que las buenas ideas por sí solas no alcanzan. Hay que encontrar a quienes pueden impulsarlas, reconocer liderazgos que muchas veces no coinciden con un puesto formal, acompañar, remover barreras y estar al servicio de que algo pueda suceder.\n\n\nY, sobre todo, entender que cada organización tiene una historia. No podemos pretender transformar algo que todavía no comprendimos.\n\n\nEl recorrido es propio, pero nunca es completamente individual.\n\n\nCuando contamos una carrera profesional solemos ordenar fechas, puestos, títulos y empresas. Parece una línea bastante más prolija de lo que realmente fue vivirla.\n\n\nPero entre esos hitos hubo personas. Algunas nos enseñaron. Otras nos hicieron preguntas. Algunas confiaron antes de que nosotros mismos estuviéramos demasiado seguros. Hubo compañeros, jefes, colegas, clientes, profesores, personas que nos mostraron una forma de hacer las cosas y otras que nos ayudaron a descubrir cómo no queríamos hacerlas.\n\n\nQuien ejerce su profesión de manera independiente forma parte de una comunidad. Aprende de otros, comparte lo que sabe, pide ayuda, acompaña y, en algún momento, también empieza a abrir caminos para alguien más.\n\n\nTal vez por eso me interesaba que esta segunda edición hablara de lo que nos pasa por dentro.\n\n\nPorque además de todo lo que aprendemos técnicamente, ejercer una profesión también nos va transformando. Cambia nuestra manera de mirar, aquello a lo que prestamos atención, las preguntas que hacemos y, muchas veces, lo que empezamos a querer para nosotros.\n\n\nCuando miro hacia atrás puedo unir puntos que mientras los estaba viviendo parecían no tener ninguna relación.\n\n\nLa línea de cajas navideñas, aquel Excel de cobranzas lleno de caritas, los primeros informes, la auditoría, las empresas familiares, la maestría, Kaizen, el coaching, las personas que fueron apareciendo y las preguntas que todavía sigo haciéndome.\n\n\nNo fue un recorrido que pudiera haber diseñado de antemano. Fue tomando forma mientras avanzaba.\n\n\nQuizás valga la pena mirar nuestra historia no sólo por lo que todavía nos falta, sino también por todo lo que ya fuimos capaces de construir.\n\n\nA veces le quitamos importancia porque suponemos que era lo que se esperaba de nosotros. Porque pensamos que cualquiera podría haberlo hecho. O porque miramos el recorrido de alguien más y nos parece mayor, más rápido o más importante que el nuestro.\n\n\nPero cada paso propio tuvo su dificultad. Hubo algo que tuvimos que aprender, decidir, atravesar o animarnos a hacer para llegar hasta acá.\n\n\nPor eso esta edición termina con una invitación.\n\n\nVolvé por un momento sobre tu propia historia. No hace falta empezar por tu primer trabajo ni hacer un currículum mental. Pensá en esas experiencias que en su momento parecían aisladas, en las personas que fueron apareciendo y en las decisiones que fueron cambiando tu manera de ejercer.\n\n\n¿Qué puntos de tu recorrido hoy podés unir?\n\n\nMe gustaría conocer tu historia. Porque quizás, al contarla, también descubras todo lo que hiciste para llegar hasta donde estás hoy.\n\n\nAndrea De Vicenzo\nMás Allá del Balance"}, {"id": "2", "title": "Más Allá del Balance: el camino que no imaginaba", "date": "2026-09-26", "body": "A los 18 años me gustaban demasiadas cosas. Literatura, francés, psicología, filosofía, contaduría. Hice un test vocacional y entre los resultados apareció hasta bibliotecaria.\n\n\nElegí estudiar Contador Público por varias razones. Los números se me daban bien, mi mejor amiga iba a estudiar lo mismo y era una carrera con buena salida laboral. En ese momento, esos motivos me alcanzaron para empezar.\n\n\nCon los años fui descubriendo otras cosas que también me gustaban.\n\n\nMe interesaba la administración, así que hice un MBA. Trabajando en empresas entendí que detrás de cada resultado hay personas que ponen su empeño todos los días. Quise comprender mejor las conversaciones que hacen falta para trabajar juntos, tomar decisiones y avanzar. También aprendí que las ideas necesitan acción y un norte; por eso estudié coaching.\n\n\nEn las empresas familiares encontré preguntas que no podía responder mirando solamente un balance o un organigrama. Y, al releer escritos míos de hace años, reconocí algo que ya estaba ahí: las ganas de entender cómo funcionan las cosas y buscar maneras de mejorarlas.\n\n\nMientras hacía mi propio recorrido, leía a colegas hablar del cansancio por los vencimientos, de las instituciones, de puestos mal diseñados y de un trabajo que muchas veces recibe poco reconocimiento. Me pregunté si había otros contadores buscando nuevos caminos, como me había pasado a mí, sin dejar atrás la profesión que habían elegido.\n\n\nAsí nació Más Allá del Balance. Primero creé un grupo en LinkedIn y empecé a publicar. Meses después quise conocer mejor a las personas que se habían acercado y armé un grupo de WhatsApp.\n\n\nAhí encontré algo que no había previsto.\n\n\nConocí contadores que disfrutan profundamente su profesión. Que eligieron caminos distintos dentro de una carrera enorme. Que hablan con interés de su trabajo, comparten lo que saben, quieren mejorar lo que hacen y todavía tienen ganas de aprender.\n\n\nEscucharlos me hizo volver a una pregunta que había dejado un poco de lado: ¿por qué elegimos ser contadores?\n\n\nYo empecé por los números, por una amiga y por la posibilidad de conseguir trabajo. Después fui encontrando muchas otras razones para seguir. Algunas tienen que ver con la contabilidad; otras, con las personas y las organizaciones con las que trabajé. Todas forman parte de la contadora que soy hoy.\n\n\nMe gustaría que este newsletter sea un lugar para conocer esos recorridos. Para contar historias de auditorías, conversar con colegas y preguntarnos qué elegimos al principio, qué fuimos descubriendo y qué queremos hacer de ahora en adelante.\n\n\nEmpiezo por vos: ¿por qué elegiste estudiar Contador Público? ¿Qué parte de la profesión disfrutás hoy?"}];const cards=document.getElementById('cards'),search=document.getElementById('search'),catalog=document.getElementById('catalog'),reader=document.getElementById('reader');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});function render(){const q=search.value.toLowerCase();let rows=entries.filter(x=>(x.title+' '+x.body).toLowerCase().includes(q));document.getElementById('count').textContent='('+rows.length+')';cards.innerHTML=rows.map(x=>`<div class="card"><div class="date">${fmt(x.date)}</div><h3>${esc(x.title)}</h3><div class="excerpt">${esc(x.body.replace(/\s+/g,' ').slice(0,170))}…</div><button type="button" class="read" data-id="${x.id}">Leer edición completa →</button></div>`).join('')||'<p>No encontramos ediciones con esa búsqueda.</p>'}function openArticle(id){const x=entries.find(y=>y.id===id);if(!x)return;document.getElementById('readingTitle').textContent=x.title;document.getElementById('readingDate').textContent=fmt(x.date);let box=document.getElementById('readingBody');box.replaceChildren();x.body.split(/\n\s*\n/).forEach(t=>{let p=document.createElement('p');p.textContent=t.trim();if(t.trim().length<77&&!/[.!?]$/.test(t.trim()))p.className='heading';box.appendChild(p)});catalog.style.display='none';reader.style.display='block';history.replaceState(null,'','#edicion-'+id);window.scrollTo(0,0)}function list(){reader.style.display='none';catalog.style.display='block';history.replaceState(null,'',location.pathname);window.scrollTo(0,0)}cards.addEventListener('click',e=>{const a=e.target.closest('[data-id]');if(a)openArticle(a.dataset.id)});search.addEventListener('input',render);document.getElementById('back').addEventListener('click',list);render();if(location.hash.startsWith('#edicion-'))openArticle(location.hash.replace('#edicion-',''));
</script></body></html>
